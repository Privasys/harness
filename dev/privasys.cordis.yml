# Privasys Harness composition overlay (measured; part of the app identity).
# Applied over the stock dsh `web` (or `headless`) profile.

# Model leg -> the attested egress proxy's /model route (CAI qwen36 on m4).
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    thinking: enabled
    reasoningEffort: low
    models:
      - id: qwen36-35b-a3b-fp8
        name: Qwen3.6 35B (Privasys attested)
        contextWindow: 131072
        maxTokens: 8192
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: qwen36-35b-a3b-fp8

# Bind the container interface: the enclave ingress proxies to it. dsh's
# webserver schema accepts only 127.0.0.1 or 0.0.0.0, and the CLI --host
# guard rejects 0.0.0.0 (a laptop-safety guard) — so set it in config, not
# on the command line. Inside an isolated enclave netns 0.0.0.0 is the only
# reachable choice; the gateway exposes only $PORT.
- id: webserver
  name: "@deepseek-ai/dsh-host-webserver"
  config:
    host: "0.0.0.0"
    port: !!js "Number(process.env.PORT)"

# Web-search tool over the attested /tool leg. failOnStartupError: false so
# a tool app being unreachable degrades that tool, never crashes the agent.
- insert:
    - id: mcp-web-search
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        transport: streamable-http
        serverName: web_search
        url: http://127.0.0.1:9411/tool/web_search/mcp
        headers:
          authorization: !!js "'Bearer ' + (process.env.PRIVASYS_BEARER || '')"
        failOnStartupError: false
