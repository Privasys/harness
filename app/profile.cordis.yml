# Privasys Harness composition overlay (measured; part of the app identity).
# Applied over the stock dsh `web` (or `headless`) profile.

# Model leg -> the attested egress proxy's /model route (CAI qwen36 on m4).
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek"
  config:
    # PIN THE ENDPOINT IN THE MEASURED CONFIG. The adapter resolves
    #   config.baseURL ?? env DEEPSEEK_BASE_URL ?? PUBLIC_BASE_URL
    # and PUBLIC_BASE_URL is https://api.deepseek.com — so relying on the
    # environment variable alone means that ANY failure to surface it (a
    # launch-environment change, a composition change, a stray unset) sends
    # this enclave's prompts to the PUBLIC DeepSeek API, silently, with no
    # attestation and no egress gate. Setting it here removes that fallback
    # from the identity: the only reachable model endpoint is the in-TCB
    # egress proxy, which fails closed when its attested peer is refused.
    # entrypoint.sh still exports the same value for headless/dev runs.
    baseURL: http://127.0.0.1:9411/model/v1
    thinking: enabled
    reasoningEffort: low
    models:
      - id: qwen36-35b-a3b-fp8
        name: Qwen3.6 35B (Privasys attested)
        contextWindow: 131072
        maxTokens: 8192
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: qwen36-35b-a3b-fp8

# Bind the container interface: the enclave ingress proxies to it. dsh's
# webserver schema accepts only 127.0.0.1 or 0.0.0.0, and the CLI --host
# guard rejects 0.0.0.0 (a laptop-safety guard) — so set it in config, not
# on the command line. Inside an isolated enclave netns 0.0.0.0 is the only
# reachable choice; the gateway exposes only $PORT.
- id: webserver
  name: "@deepseek-ai/dsh-host-webserver"
  config:
    host: "127.0.0.1"
    port: 3080

# System prompt: Privasys deployment persona, and drop the fixed "powered by
# DeepSeek Harness" identity line. NOTE: agent presets mount their own
# dsh-persona row which SHADOWS this deployment persona in preset sessions —
# apply-overlay.mjs rewrites the preset persona texts too; this row covers
# non-preset flows (headless, custom compositions). A patch REPLACES the
# row's whole config, so restate everything.
- id: system-prompt
  name: "@deepseek-ai/dsh-system-prompt"
  config:
    includeHarnessIdentity: false
    # Accurate under EVERY egress posture. The previous text said the model
    # and web tools run "exclusively in attested enclaves", which stops being
    # true the moment HARNESS_EGRESS_MODE admits direct fetches from the
    # shell — a claim that would have quietly gone false in the product and in
    # the published article. State the attested part as attested, name the
    # unattested part, and give the agent the operational rule that follows.
    persona: >-
      You are an agent of the Privasys Harness, running inside a
      hardware-attested confidential enclave. Your model and your attested
      tools run in enclaves over mutually authenticated encrypted channels,
      and the platform operator cannot read this conversation. Any direct
      network access you make from the shell is governed by this harness's
      egress policy and is NOT attested: prefer the attested tools whenever
      the provenance of what you fetch matters.

# Drop dsh's DEV-oriented prompt sections: surfaceContext gates BOTH the
# "DeepSeek Harness implementation checkout is at /dsh" harness-source section
# and the "Web GUI at http://127.0.0.1:3080 ... pnpm run dev:web" orientation —
# developer-workflow text that is false and off-brand in the deployed product
# (our persona + runtime context orient the agent). A patch replaces the whole
# config, so the other keys are restated (same !!js sources as upstream).
- id: web-runtime
  name: "@deepseek-ai/dsh-web-app"
  inject: [webStartup]
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# Clock for the agent (dsh injects NO date/time by default). dsh-time-context
# appends a timestamp message at the ABSOLUTE TAIL of the step batch
# (prepend:true listener) and throttles refreshes — the cache-safe injection
# shape our Confidential AI context work standardised (never mutate the
# prefix; volatile context rides the tail).
- insert:
    - id: time-context
      name: "@deepseek-ai/dsh-time-context"
      config:
        refreshIntervalMs: 60000

# The agent's ONLY egress is the attested fleet. The built-in web surface
# (DeepSeek-cloud Search, public WebFetch), the DeepSeek reporting rows, and
# the other non-admitted plugins are no longer disabled here — they simply do
# not exist: the profiles compose over @privasys/harness-bundle (an ALLOW-LIST
# replacement for dsh-base, see bundle/harness-bundle/cordis.patch.yml), and
# the Dockerfile asserts at build time that no excluded row reappears.
#
# The three attested platform tools (web_search / web_reader / drive over the
# egress proxy's /tool/{name}/mcp shim) are composed IN THE AGENT PRESETS, not
# here: preset rows are what the Settings "Plugins" inventory lists as session
# plugins, and the preset layer is where per-preset activation lives (see
# apply-overlay.mjs §2c — the rows replace the removed built-in tool-web).

# Sessions live in MEMORY here and on the user's Drive there.
#
# The harness enclave holds no durable user data. Not on the container layer
# (where a redeploy destroyed every conversation), and not on the encrypted
# volume either: /data is per-enclave, survives redeploys, and is therefore
# still the harness keeping the user's transcripts. D6' says the durable home
# of a user's data is their own Drive, under their own keys, and an encrypted
# copy the operator's enclave keeps is not that.
#
# So the session root is a tmpfs chosen at boot (entrypoint.sh writes the
# resolved path into /run/session-root.cordis.yml, applied as a later patch
# that overrides this one). What lives there is a working copy for the length
# of one container's life; the record is mirrored to Drive continuously and
# restored from it on start.
#
# This row keeps a NON-DURABLE default so that a boot which somehow finds no
# tmpfs still refuses to write conversations to the encrypted volume.
- id: session-persistence-jsonl
  name: "@deepseek-ai/dsh-session-persistence-jsonl"
  config:
    root: /dev/shm/privasys-sessions
