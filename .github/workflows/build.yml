name: Build & Publish

# Publishes the measured harness image to GHCR on every push to main, the same
# way the other platform apps do (GITHUB_TOKEN + packages:write — no personal
# access token). The image is self-contained: the Dockerfile clones dsh at its
# pin, the Privasys Go fork toolchain, and ra-tls-clients, all from public
# sources, then applies the web overlay and builds. Deploy to an enclave is a
# separate platform step (stage/promote/deploy via the management service).

on:
  push:
    branches: [main]
    paths:
      - 'proxy/**'
      - 'web/**'
      - 'app/**'
      # The allow-list bundle is COPYed into the image, so it is part of the
      # measured tree: an edit here alone must still produce a new image.
      - 'bundle/**'
      - 'brands/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  # A push builds the Privasys brand. An adopter's brand (brands/<name>) is
  # built on demand, once per harness roll that adopter takes, rather than on
  # every push: a branded image nobody deploys is 25 runner-minutes wasted.
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand to build (a directory under brands/)'
        default: privasys

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & push image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The dsh monorepo build (pnpm install + build) plus the multi-stage
      # image is large; reclaim the runner's preinstalled toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af
          df -h /
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        env:
          BRAND: ${{ inputs.brand || 'privasys' }}
        run: |
          [[ "$BRAND" =~ ^[a-z][a-z0-9-]{0,62}$ && -f "brands/$BRAND/brand.json" ]] || { echo "unknown brand $BRAND"; exit 1; }
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "brand=$BRAND" >> "$GITHUB_OUTPUT"
          # The Privasys brand keeps its plain tags; any other is prefixed.
          if [[ "$BRAND" == privasys ]]; then echo "prefix=" >> "$GITHUB_OUTPUT"; else echo "prefix=$BRAND-" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            HARNESS_BRAND=${{ steps.repo.outputs.brand }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.repo.outputs.prefix }}latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.repo.outputs.prefix }}${{ github.sha }}
