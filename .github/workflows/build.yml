name: Build & Publish

# Publishes the measured harness image to GHCR on every push to main, the same
# way the other platform apps do (GITHUB_TOKEN + packages:write — no personal
# access token). The image is self-contained: the Dockerfile clones dsh at its
# pin, the Privasys Go fork toolchain, and ra-tls-clients, all from public
# sources, then applies the web overlay and builds. Deploy to an enclave is a
# separate platform step (stage/promote/deploy via the management service).

on:
  push:
    branches: [main]
    paths:
      - 'proxy/**'
      - 'web/**'
      - 'app/**'
      # The allow-list bundle is COPYed into the image, so it is part of the
      # measured tree: an edit here alone must still produce a new image.
      - 'bundle/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & push image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The dsh monorepo build (pnpm install + build) plus the multi-stage
      # image is large; reclaim the runner's preinstalled toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af
          df -h /
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
